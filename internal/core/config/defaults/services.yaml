version: 1
services:
  sway: { enabled: true, required: false }
  workspace: { enabled: true, required: false, depends_on: [sway] }
  shell: { enabled: true, required: false, depends_on: [workspace] }
  wallpaper: { enabled: true, required: false, depends_on: [workspace] }
  notification: { enabled: false }
  audio: { enabled: false }
  network: { enabled: false }
  power: { enabled: false }
  idle: { enabled: false }
  lock: { enabled: false }
  screenshot: { enabled: false }
  clipboard: { enabled: false }
  display: { enabled: false }
  media: { enabled: false }
