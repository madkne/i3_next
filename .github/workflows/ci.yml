name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  go:
    name: Go (format, vet, lint, static analysis, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not gofmt-clean:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Tests
        run: go test -race ./...

      - name: Build
        run: make build

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

  qml:
    name: QML (qmllint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Qt tools
        run: sudo apt-get update && sudo apt-get install -y qml6-module-qtquick qt6-declarative-dev-tools || true
      - name: qmllint
        run: |
          if command -v qmllint >/dev/null 2>&1; then
            find ui -type f -name '*.qml' -print0 | xargs -0 -r qmllint
          else
            echo "qmllint not available; skipping"
          fi
